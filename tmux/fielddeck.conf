# FieldDeck tmux configuration.
#
# This is the top-level navigation of the whole device: on a 480x320 panel there
# is no window manager, no taskbar and no launcher, so the tmux status line is
# the only permanent navigation an operator has. Everything below exists to make
# that one line reliable and touchable.
#
# The panel is roughly 80x25 cells at 6x12 px. That gives ~6 px per column, so a
# 90 px touch target is 15 columns — which is where the padding in the window
# format comes from. Widen the format and the four windows stop fitting on one
# line; narrow it and an operator with cold hands cannot hit them.
#
# Loaded by tmux/fielddeck-session.sh, which is what the kiosk starts. It is
# also perfectly usable over SSH: 'fielddeck-session' gives you the same four
# windows on a laptop.

# --- terminal ---------------------------------------------------------------

# Not tmux-256color: that terminfo entry lives in the ncurses-term package,
# which is not on a Raspberry Pi OS Lite image. A missing entry does not
# degrade — Textual fails to start and the HMI window shows a traceback.
# screen-256color is present everywhere and is enough for the palette the HMI
# uses.
set -g default-terminal "screen-256color"

# tmux waits this long after ESC to see whether a key sequence follows. The
# default is 500 ms, and it makes every arrow key and every ESC in the Textual
# HMI feel broken. 10 ms is long enough for a real escape sequence over a slow
# serial console and short enough that nobody notices it.
set -sg escape-time 10

# Enough scrollback for the LOG window to be worth scrolling.
set -g history-limit 20000

# Redraw the status line every 5 s. The clock does not need to be to the
# second, and this is a Pi.
set -g status-interval 5

# --- touch ------------------------------------------------------------------

# The whole point. With mouse mode on, tmux marks each window name in the status
# line as a clickable range, so tapping "2:CLAUDE" switches to it. It also gives
# the LOG window wheel/drag scrollback, which on a touchscreen is a drag on the
# text area.
set -g mouse on

# Window numbers are touch targets and appear in documentation and in muscle
# memory. They must not move when a window is closed and reopened.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows off

# Nor may the names change. A program that sets its own title would rename the
# button under the operator's finger.
set -g allow-rename off
set -g automatic-rename off

# --- status line ------------------------------------------------------------

# One line, always visible. Never off, never two lines: on a 25-row panel the
# second line costs 4% of the screen, and an operator who cannot see which
# window they are in is lost.
set -g status on
set -g status-position bottom
set -g status-justify left

# Colours stay in the basic 8 plus one grey, so the panel is still readable on a
# washed-out resistive screen and in monochrome.
set -g status-style "bg=black,fg=white"
set -g message-style "bg=yellow,fg=black"
set -g mode-style "bg=yellow,fg=black"
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=green"

# The width budget for this line is 80 columns and it is genuinely tight:
# four 15-column window buttons already cost 60. That leaves 20 for everything
# else, so the left marker is two characters and the right side is the clock.
# Anything longer — a session name, a hostname, a battery percentage — pushes
# the fourth window off the line and tmux replaces it with a '>'. The window
# you cannot see is the one you needed.
set -g status-left "#[bg=green,fg=black,bold]FD#[default] "
set -g status-left-length 4

# '^B' appears while the prefix key is held, because on a panel with no visible
# modifier state a half-entered command otherwise looks like a frozen device.
set -g status-right "#{?client_prefix,#[bg=yellow#,fg=black]^B#[default] ,}#[bold]%H:%M "
set -g status-right-length 12

# 13 padded columns plus the two spaces = a 15-column, ~90 px touch target.
# Do NOT override status-format: the default wraps each of these in a
# 'range=window' region, and that is what makes the tap land on the right
# window.
set -g window-status-separator ""
set -g window-status-format "  #{p13:#{window_index}:#{window_name}}"
set -g window-status-current-format "#[bg=white,fg=black,bold]  #{p13:#{window_index}:#{window_name}}#[default]"
# A window whose process died and is waiting to respawn shouts in yellow.
set -g window-status-bell-style "bg=yellow,fg=black,bold"

# --- keys -------------------------------------------------------------------
#
# Every touch target needs a keyboard equivalent: the panel has a USB keyboard
# often enough, and SSH always does.
#
# F1..F4 select the four windows with no prefix key at all. The prefix is still
# C-b for everything else, because a device you have to re-learn is a device you
# get wrong under pressure.
bind-key -n F1 select-window -t :1
bind-key -n F2 select-window -t :2
bind-key -n F3 select-window -t :3
bind-key -n F4 select-window -t :4

# Reload this file after editing it, without restarting the session.
bind-key R source-file -q /etc/fielddeck/tmux.conf \; display-message "tmux.conf reloaded"

# Deliberately NOT bound: anything that kills the session or the server. The
# four windows are the product; 'tmux kill-session' is a thing you should have
# to type in full.

# --- safety-adjacent behaviour ----------------------------------------------

# Detaching must never take the panel down with it. The kiosk attaches a client
# to a session the tmux server owns; when that client goes away — SSH dropped,
# X restarted — the session and everything running in it stays up, which is how
# a capture survives a display crash.
set -g destroy-unattached off
set -g detach-on-destroy off

# Panes are not part of the FieldDeck model: four windows, one pane each. Nobody
# is splitting a 40-column pane on a 480 px screen on purpose, and a stray split
# hides half the HMI.
unbind-key '"'
unbind-key %
