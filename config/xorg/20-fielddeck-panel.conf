# FieldDeck panel — pin the kiosk X server to the OSOYOO 3.5" SPI display.
#
# Read ONLY by the kiosk, via -configdir /etc/fielddeck/xorg.conf.d in
# fielddeck-kiosk.sh. It must not live in /etc/X11/xorg.conf.d: that directory
# is shared with every other X server on this machine, and these sections are
# not advice, they are "draw on the 480x320 SPI framebuffer". Put them there and
# the Field-Op desktop moves onto the panel too.
#
# fb0 is HDMI (vc4drmfb); fb1 is this panel (fb_ili9486). Confirm before
# changing anything:  cat /sys/class/graphics/fb*/name

Section "Device"
    Identifier "FieldDeck panel"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb1"
EndSection

Section "Monitor"
    Identifier "FieldDeck monitor"
EndSection

Section "Screen"
    Identifier "FieldDeck screen"
    Device     "FieldDeck panel"
    Monitor    "FieldDeck monitor"
    DefaultDepth 16
    SubSection "Display"
        Depth  16
        Modes  "480x320"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "FieldDeck layout"
    Screen     "FieldDeck screen"
EndSection
