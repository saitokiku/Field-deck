# FieldDeck — minimal X input configuration for a resistive touch panel.
# Installed as /etc/X11/xorg.conf.d/10-fielddeck-touch.conf
#
# This file configures input and screen blanking. It does not configure a
# desktop, because there is not one: no window manager, no compositor, no panel.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE DEBUGGING A DRIVER PROBLEM
# ---------------------------------------------------------------------------
# Files in /etc/X11/xorg.conf.d are read in lexicographic order, and for any
# single option the LAST matching section wins. Debian ships
# /usr/share/X11/xorg.conf.d/40-libinput.conf, which sorts after this file and
# claims every touchscreen with Driver "libinput".
#
# That is fine, and it is why this file sets *options* rather than a driver:
# options from all matching InputClass sections are merged, so the calibration
# below applies whichever driver ends up bound.
#
# If you genuinely need the evdev driver — some cheap resistive controllers
# report pressure in a way libinput discards — you cannot do it from a file
# named 10-*. Put the Driver line in a file that sorts later, e.g.:
#
#   /etc/X11/xorg.conf.d/45-fielddeck-evdev.conf
#     Section "InputClass"
#         Identifier  "FieldDeck touchscreen evdev"
#         MatchIsTouchscreen "on"
#         MatchDevicePath "/dev/input/event*"
#         Driver "evdev"
#     EndSection
#
# Check what actually got bound with:  grep -i "using input driver" /var/log/Xorg.0.log
# ---------------------------------------------------------------------------

Section "ServerFlags"
    # Belt and braces with the xset calls in /etc/fielddeck/xinitrc. An
    # instrument panel that blanks is a panel an operator has to touch to read,
    # and touching a FieldDeck panel is how you press buttons.
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"

    # No X network listener. Nothing off this device should draw on the panel.
    Option "DontVTSwitch" "off"   # Alt+F2 to a getty stays available: it is the
                                  # recovery path when the HMI is wedged.
    # Stops X from adopting a second GPU/DRM device as an output. On a unit
    # whose panel is fbdev, that is what keeps the session on the panel instead
    # of quietly moving to HDMI. If X now exits with "no screens found", this is
    # the first line to try removing.
    Option "AutoAddGPU"   "off"
EndSection

Section "InputClass"
    Identifier "FieldDeck touchscreen"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/event*"

    # --- calibration ------------------------------------------------------
    #
    # TransformationMatrix is the driver-agnostic form: the X server applies it
    # to any input device, libinput or evdev. (libinput's own equivalent is
    # Option "CalibrationMatrix" with the same nine values; you only need one
    # of the two.)
    #
    # Row-major 3x3, applied to coordinates normalised to 0..1:
    #
    #     | a b c |     x' = a*x + b*y + c
    #     | d e f |     y' = d*x + e*y + f
    #     | 0 0 1 |
    #
    # The identity below changes nothing and is the right starting point: get
    # the panel showing something first, then calibrate.
    Option "TransformationMatrix" "1 0 0 0 1 0 0 0 1"

    # HOW TO COMPUTE YOUR OWN
    #
    # xinput_calibrator is no longer packaged in Debian (it was dropped after
    # Buster), so do it by hand. It takes two minutes.
    #
    # 1. Find the device and watch where taps land:
    #        xinput list                       # note the touchscreen's id
    #        xinput --test-xi2 --root          # tap, read the root x/y in pixels
    #
    # 2. Tap as close to each of the four screen corners as you can and write
    #    down the reported pixel coordinates. Convert them to fractions of the
    #    screen:  xmin = x_at_left_edge / screen_width, and so on. On a panel
    #    with no calibration a tap on the left edge might report 0.08 and one
    #    on the right edge 0.94.
    #
    # 3. Build the matrix that stretches [xmin..xmax] back onto [0..1]:
    #
    #        a = 1 / (xmax - xmin)        c = -xmin / (xmax - xmin)
    #        e = 1 / (ymax - ymin)        f = -ymin / (ymax - ymin)
    #
    #        Option "TransformationMatrix" "a 0 c 0 e f 0 0 1"
    #
    #    Worked example, xmin=0.08 xmax=0.94 ymin=0.05 ymax=0.97:
    #        a = 1/0.86 = 1.1628   c = -0.08/0.86 = -0.0930
    #        e = 1/0.92 = 1.0870   f = -0.05/0.92 = -0.0543
    #        Option "TransformationMatrix" "1.1628 0 -0.0930 0 1.0870 -0.0543 0 0 1"
    #
    # 4. Try it live before you commit it to this file — no restart needed:
    #        xinput set-prop <id> "Coordinate Transformation Matrix" \
    #            1.1628 0 -0.0930 0 1.0870 -0.0543 0 0 1
    #    When it feels right, paste the same nine numbers above and restart the
    #    kiosk:  sudo systemctl restart fielddeck-kiosk
    #
    # ROTATION AND MIRRORING. If touch is 90 degrees out or mirrored, start from
    # one of these instead of the identity, then calibrate on top of it:
    #
    #     no rotation        "1 0 0   0 1 0   0 0 1"
    #     90 clockwise       "0 -1 1  1 0 0   0 0 1"
    #     180                "-1 0 1  0 -1 1  0 0 1"
    #     270 clockwise      "0 1 0   -1 0 1  0 0 1"
    #     mirror horizontal  "-1 0 1  0 1 0   0 0 1"
    #     mirror vertical    "1 0 0   0 -1 1  0 0 1"

    # --- behaviour --------------------------------------------------------

    # A resistive panel is a single-contact device pretending to be a mouse.
    # Tap-to-click is what turns a touch into the button-1 press that tmux and
    # the HMI understand.
    Option "Tapping" "on"

    # No gestures. A two-finger scroll on a resistive panel is noise, and an
    # accidental swipe must never be interpreted as a drag across the ARM tile.
    Option "ScrollMethod" "none"
    Option "HorizontalScrolling" "off"

    # Absolute device: acceleration would move a tap away from where it landed.
    Option "AccelProfile" "flat"
    Option "AccelSpeed" "0"

    # Left-handed operators are welcome; nothing here depends on button order.
EndSection

Section "InputClass"
    # A USB mouse or trackball plugged into the Pi, for bench work where a
    # fingertip on a 480x320 panel is not precise enough.
    Identifier "FieldDeck pointer"
    MatchIsPointer "on"
    MatchDevicePath "/dev/input/event*"
    Option "AccelProfile" "flat"
    Option "MiddleEmulation" "off"
EndSection

# ---------------------------------------------------------------------------
# SPI PANELS
#
# A 480x320 SPI panel (ILI9486, ILI9341, ST7789 and friends) shows up as a
# framebuffer — /dev/fb1, with /dev/fb0 being the HDMI output — and the modern
# kernel path for those is fbtft/tinydrm via a dtoverlay in
# /boot/firmware/config.txt. FieldDeck's installer does NOT edit that file: the
# right overlay depends on your exact panel, and a wrong one costs you the next
# boot with no display to fix it from.
#
# If X comes up on HDMI instead of the panel, uncomment the section below and
# point it at the right framebuffer. Check which is which first:
#     cat /sys/class/graphics/fb0/name /sys/class/graphics/fb1/name
#
# Section "Device"
#     Identifier "FieldDeck panel"
#     Driver     "fbdev"
#     Option     "fbdev" "/dev/fb1"
# EndSection
#
# Section "Monitor"
#     Identifier "FieldDeck monitor"
# EndSection
#
# Section "Screen"
#     Identifier "FieldDeck screen"
#     Device     "FieldDeck panel"
#     Monitor    "FieldDeck monitor"
#     DefaultDepth 16
#     SubSection "Display"
#         Depth  16
#         Modes  "480x320"
#     EndSubSection
# EndSection
#
# The fbdev driver usually also needs /etc/X11/Xwrapper.config to say
# needs_root_rights=yes, because it opens the framebuffer directly rather than
# going through a DRM device with logind ACLs on it.
# ---------------------------------------------------------------------------
