name: Feature request
description: Something FieldDeck should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >-
        The situation, not the solution. What were you working on when you
        wanted this?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: If you have a shape in mind, describe it. If not, that's fine.

  - type: dropdown
    id: authority
    attributes:
      label: Would this need to touch hardware?
      description: >-
        Anything that transmits, energises, writes or erases needs a permission
        class and gets read carefully. Purely analytical features are much
        easier to land.
      options:
        - "No — analysis, display, or reading existing captures"
        - "Yes — it would transmit, energise, write or erase"
        - "Not sure"
    validations:
      required: true
