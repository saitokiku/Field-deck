name: CI

# Everything here runs with no hardware attached. That is a hard requirement,
# not a limitation of the runner: if a test needs a device it is marked
# `hardware` and is never collected here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,compress]'

      - name: Lint
        run: |
          ruff check fielddeck tests
          ruff format --check fielddeck tests

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest -ra --durations=10

      - name: Documented commands
        # Runs the fdctl commands printed in README.md and docs/ and fails on
        # any that Click cannot parse. Six were wrong when this was written.
        run: pytest tests/test_documented_commands.py -ra

  import-cost:
    # `fdctl status` should not pay for the HMI. fielddeck/__init__.py uses PEP
    # 562 lazy re-exports to keep that true, and it is the kind of property that
    # regresses silently the first time somebody adds a convenience import.
    name: import cost
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Importing fielddeck must not pull in the heavy optional stack
        run: |
          python - <<'PY'
          import subprocess, sys
          code = (
              "import sys, fielddeck; "
              "heavy = sorted(m for m in ('textual','serial','can','pyvisa','numpy') "
              "if m in sys.modules); "
              "print(','.join(heavy))"
          )
          out = subprocess.run(
              [sys.executable, "-c", code], capture_output=True, text=True, check=True
          ).stdout.strip()
          if out:
              print(f"::error::importing fielddeck pulled in: {out}")
              sys.exit(1)
          print("clean: no heavy modules imported")
          PY

  scripts:
    # The install path is shell, and shell fails at runtime rather than at
    # import. shellcheck is the closest thing to a typechecker it has.
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          for f in scripts/*.sh tmux/*.sh; do
            echo "-- $f"
            bash -n "$f"
          done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh tmux/*.sh

      - name: Installer dry run
        # --dry-run needs no root and changes nothing. It must stay runnable,
        # because "read the plan before you run it" is the documented workflow.
        #
        # -y because the runner is x86_64: the installer correctly refuses to
        # guess on a non-Pi, non-interactively, and that refusal is a feature
        # worth keeping rather than working around in the script.
        run: scripts/install.sh --dry-run -y

  config:
    # An example config that does not load is worse than no example: people
    # copy it, and find out at the point they most need the daemon to start.
    name: example configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Every shipped config and recipe must parse
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml
          from fielddeck.common.config import FieldDeckConfig, SafetyConfig
          from fielddeck.recipes.schema import load_recipe_file

          failures = []

          for path, model in (
              (Path("config/fielddeck.example.yaml"), FieldDeckConfig),
              (Path("config/safety.example.yaml"), SafetyConfig),
          ):
              try:
                  model.model_validate(yaml.safe_load(path.read_text()) or {})
                  print(f"ok  {path}")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          for path in sorted(Path("recipes/examples").glob("*.yaml")):
              try:
                  load_recipe_file(path)
                  print(f"ok  {path}")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          for line in failures:
              print(f"::error::{line}")
          sys.exit(1 if failures else 0)
          PY

  safety-invariants:
    # A dedicated job so that a red X on a pull request says "safety" rather
    # than "tests", and so this can be a required check on its own.
    name: safety invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev,compress]'
      - run: pytest tests/safety -ra -v
